name: ty type check
on:
  pull_request:
    branches: [ '*' ]
    types: [ opened, synchronize, reopened, ready_for_review ]
jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ty check
