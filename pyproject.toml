[project]
name = "trompa-align"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "audioop-lts>=0.2.2",
    "celery==5.6.2",
    "click~=8.3.3",
    "flask~=3.1.0",
    "flask-cors==6.0.5",
    "flask-shell-ipython~=0.5.3",
    "flask-sqlalchemy~=3.1.1",
    "ipython~=8.35.0",
    "jinja2~=3.1.2",
    "jwcrypto~=1.5.6",
    "lxml~=6.1.3",
    "midi2audio~=0.1.1",
    "mido~=1.2.10",
    "oic~=1.7.0",
    "psycopg2-binary~=2.9.10",
    "pydub~=0.25.1",
    "pyld~=2.0.3",
    "python-dotenv~=1.2.2",
    "pytz>=2025.2",
    "rdflib~=7.0",
    "redis~=5.2.1",
    "requests~=2.34.2",
    "sentry-sdk[flask]~=2.27.0",
    "solidauth-oidc",
    "sqlalchemy~=2.0.1",
    "verovio~=5.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff~=0.16.7",
    "ty>=0.0.81",
]
prod = [
  "gunicorn"
]

[tool.uv.sources]
solidauth-oidc = { git = "https://github.com/trompamusic/solidauth-oidc.git", rev = "main" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "E741",
    "SIM102",
    "UP030",
    "UP031",
    "UP032",
    # ignored from upgrade to ruff 0.16
    "BLE001",
    "LOG015",
    "S110",
    "S112",
]

[tool.ty.src]
include = ["trompaalign", "scripts", "app.py", "config.py"]

[tool.ty.rules]
# os.system in scripts/smat_align.py is soft-deprecated, not an error.
deprecated = "ignore"
